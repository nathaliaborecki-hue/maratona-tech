<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#DesconfieTech | Tecnologia e Algoritmos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e17 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
            color: #ffffff;
            text-align: center;
            max-width: 1000px;
            margin: 30px auto;
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.15);
            border: 1px solid #2a3f5a;
        }

        header h1 {
            font-size: 2.8em;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.2em;
            margin: 10px 0 20px;
            color: #8899aa;
        }

        header button {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            border: none;
            padding: 8px 20px;
            margin: 5px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.2);
        }

        header button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.4);
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }

        article {
            background: linear-gradient(145deg, #1a2332, #0d1b2a);
            border: 1px solid #2a3f5a;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        article:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(0, 150, 255, 0.15);
            border-color: #00d4ff;
        }

        article div:first-child {
            flex: 1;
        }

        article div:first-child img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #00d4ff;
            margin-bottom: 15px;
            object-fit: cover;
        }

        article h2 {
            color: #00d4ff;
            font-size: 1.6em;
            margin: 10px 0 5px;
            border-bottom: 2px solid #2a3f5a;
            padding-bottom: 5px;
            display: inline-block;
        }

        article .artigo-autor {
            color: #7b2ffc;
            font-weight: bold;
            font-style: italic;
            margin: 5px 0 10px;
        }

        article p {
            color: #b0c4d9;
            margin: 10px 0;
        }

        .destaque-tec {
            background: rgba(0, 212, 255, 0.08);
            border-left: 3px solid #00d4ff;
            padding: 10px 15px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }

        .tag-tec {
            display: inline-block;
            background: rgba(0, 212, 255, 0.12);
            color: #00d4ff;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-right: 5px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        article button {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            border: none;
            padding: 6px 15px;
            margin: 5px 5px 5px 0;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        article button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }

        article div:last-child {
            flex-shrink: 0;
        }

        .imagem {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            border: 2px solid #2a3f5a;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .imagem:hover {
            border-color: #00d4ff;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
        }

        footer {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
            color: #8899aa;
            text-align: center;
            padding: 25px;
            max-width: 1000px;
            margin: 30px auto;
            border-radius: 15px;
            border: 1px solid #2a3f5a
        }
